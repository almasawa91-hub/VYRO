name: VYRO Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VYRO Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Gradle version
        run: |
          gradle --version
          gradle --version | grep "Gradle 9.5"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Create CI debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          chmod 600 "$HOME/.config/.android/debug.keystore"

      - name: Show Android signing fingerprints
        working-directory: android
        run: |
          echo "=== Gradle version used for signingReport ==="
          gradle --version
          echo "=== Android signing fingerprints ==="
          gradle signingReport

      - name: Direct SHA-1 and SHA-256 verification
        run: |
          echo "=== CI debug.keystore SHA-1 / SHA-256 ==="
          keytool -list -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey |
            grep -E "Alias name:|SHA1:|SHA256:"

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          test -s "$APK"
          echo "=== APK ==="
          ls -lh "$APK"

      - name: Verify AAB
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          test -s "$AAB"
          echo "=== AAB ==="
          ls -lh "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
