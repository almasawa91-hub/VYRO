name: vyro
description: "VYRO - فايرو - Production Social, Video, Messaging & Marketplace Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_database: ^11.3.1
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.3
  firebase_crashlytics: ^4.3.3
  firebase_app_check: ^0.3.2+4
  google_sign_in: ^7.2.0

  # UI & Media Components
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  video_player: ^2.9.2
  permission_handler: ^11.4.0
  just_audio: ^0.9.46
  url_launcher: ^6.3.1
  dio: ^5.8.0+1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
